name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - mindustry_launcher.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name MindustryLauncher mindustry_launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindustryLauncher-windows
          path: dist/MindustryLauncher.exe

      - name: Attach exe to release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MindustryLauncher.exe
